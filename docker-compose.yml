services:
  mxgt:
    build: .
    image: mxgt:latest
    container_name: mxgt
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 运行目录持久化：config.yaml / data(SQLite) / cache / logs / uploads 全在 /app
    volumes:
      - mxgt-data:/app/data
    environment:
      # 可用环境变量覆盖默认管理员账号
      - MXGT_ADMIN_USER=admin
      - MXGT_ADMIN_PASSWORD=admin123

volumes:
  mxgt-data: