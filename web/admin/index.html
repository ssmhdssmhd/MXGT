<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MXGT 管理后台</title>
<!-- Vue3 + Element Plus 现代化组件化后台（CDN 单文件，go:embed 内嵌，无需构建） -->
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue/dist/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{--brand:#409eff}
html,body,#app{height:100%;margin:0;background:#f2f3f8}
.app-container{height:100vh;display:flex}
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.main-head{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 4px rgba(0,0,0,.06);z-index:5}
.main-body{flex:1;overflow:auto;padding:20px}
.panel{background:#fff;border-radius:8px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.logo-title{font-weight:700;font-size:17px;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:8px}
.brand-bg{background:linear-gradient(135deg,#409eff,#0ea5e9)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.vl{color:#c0c4cc}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px}
.stat-card .num{font-size:26px;font-weight:700;color:#409eff}
.stat-card .lbl{color:#909399;font-size:13px}
.stat-card .sub{color:#67c23a;font-size:12px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);height:300px}
.chart h4{margin:0 0 8px;color:#606266;font-size:14px}
.login-card{max-width:420px;margin:12vh auto}
.mono{font-family:Consolas,Menlo,monospace}
.step-list .el-timeline-item__content{font-size:12px}
</style>
</head>
<body>
<div id="app">
  <!-- 登录 -->
  <el-container v-if="!token" class="app-container" style="justify-content:center">
    <el-card style="width:400px" class="login-card">
      <template #header>
        <div style="text-align:center;font-weight:700;font-size:18px;color:#409eff">MXGT 管理后台</div>
      </template>
      <el-form :model="loginForm" label-width="70px">
        <el-form-item label="用户名"><el-input v-model="loginForm.username" placeholder="admin" clearable/></el-form-item>
        <el-form-item label="密码"><el-input v-model="loginForm.password" type="password" show-password placeholder="admin123" @keyup.enter="doLogin"/></el-form-item>
        <el-button type="primary" style="width:100%" :loading="loginLoading" @click="doLogin">登 录</el-button>
      </el-form>
    </el-card>
  </el-container>

  <!-- 主界面 -->
  <el-container v-else class="app-container">
    <el-aside width="218px" class="brand-bg" style="display:flex;flex-direction:column">
      <div class="logo-title">🚀 MXGT 后台</div>
      <el-menu :default-active="current" @select="onMenu" style="flex:1;border:none;background:transparent" text-color="#cbd5e1" active-text-color="#fff">
        <el-menu-item v-for="m in menus" :key="m.key" :index="m.key">
          <el-icon><component :is="m.icon"/></el-icon><span>{{m.label}}</span>
        </el-menu-item>
      </el-menu>
      <div style="padding:14px 20px;color:#93c5fd;font-size:12px">核心功能链路已打通</div>
    </el-aside>
    <div class="main-wrap">
      <div class="main-head">
        <div style="font-size:15px;font-weight:600">{{currentTitle}}</div>
        <div style="display:flex;align-items:center;gap:12px">
          <el-tag size="small" type="info">{{version}}</el-tag>
          <el-tag size="small">{{username}}</el-tag>
          <el-button size="small" @click="logout">退出</el-button>
        </div>
      </div>
      <div class="main-body">
        <!-- 仪表盘 -->
        <template v-if="current==='dash'"><dash-view/></template>
        <!-- 播放测试（核心功能入口） -->
        <template v-else-if="current==='play'"><play-view/></template>
        <!-- 前端设置 -->
        <template v-else-if="current==='front'"><front-view/></template>
        <!-- 分析设置 -->
        <template v-else-if="current==='analysis'"><analysis-view/></template>
        <!-- AI 设置 -->
        <template v-else-if="current==='ai'"><ai-view/></template>
        <!-- 匹配设置 -->
        <template v-else-if="current==='matching'"><matching-view/></template>
        <!-- 调用设置 -->
        <template v-else-if="current==='chain'"><chain-view/></template>
        <!-- 解析规则 -->
        <template v-else-if="current==='rules'"><rules-view/></template>
        <!-- 采集源 -->
        <template v-else-if="current==='sources'"><sources-view/></template>
        <!-- 映射设置 -->
        <template v-else-if="current==='mapping'"><mapping-view/></template>
        <!-- 影片管理 -->
        <template v-else-if="current==='vods'"><vods-view/></template>
        <!-- 更新设置 -->
        <template v-else-if="current==='updater'"><updater-view/></template>
        <!-- 管理 -->
        <template v-else-if="current==='admin'"><admin-view/></template>
      </div>
    </div>
  </el-container>
</div>

<script>
const { createApp, ref, reactive, onMounted, onBeforeUnmount, nextTick, h } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

// ---------- 全局 API 封装 ----------
const api = {
  base: (location.protocol==='https:'?'https:':'http:')+'//'+location.host,
  token: localStorage.getItem('mxgt_token')||'',
  async req(method, url, body) {
    const opt = { method, headers: {'Content-Type':'application/json'} };
    if (this.token) opt.headers['Authorization'] = 'Bearer '+this.token;
    if (body!==undefined) opt.body = JSON.stringify(body);
    const r = await fetch(this.base+url, opt);
    let data = null;
    const ct = r.headers.get('content-type')||'';
    if (ct.includes('application/json')) data = await r.json(); else data = await r.text();
    if (!r.ok && r.status===401 && !url.startsWith('/admin/login')) {
      ElMessage.warning('登录已过期'); location.reload(); throw new Error('unauthorized');
    }
    return data;
  },
  get(url){ return this.req('GET', url); },
  post(url, body){ return this.req('POST', url, body); },
  put(url, body){ return this.req('PUT', url, body); },
  del(url){ return this.req('DELETE', url); }
};

function okData(res){ return res && res.code===1 ? res.data : null; }

// ---------- 品牌首页 ----------
const App = {
  setup() {
    const token = ref(api.token);
    const username = ref(localStorage.getItem('mxgt_user')||'admin');
    const current = ref('dash');
    const version = ref('');
    const loginForm = reactive({username:'admin', password:'admin123'});
    const loginLoading = ref(false);

    const menus = [
      {key:'dash',   label:'仪表盘',   icon:'Odometer'},
      {key:'play',   label:'播放测试', icon:'VideoPlay'},
      {key:'front',  label:'前端设置', icon:'Monitor'},
      {key:'analysis',label:'分析设置',icon:'Cpu'},
      {key:'ai',     label:'AI 设置',  icon:'MagicStick'},
      {key:'matching',label:'匹配设置',icon:'Aim'},
      {key:'chain',  label:'调用设置', icon:'Link'},
      {key:'rules',  label:'解析规则', icon:'Document'},
      {key:'sources',label:'采集源',   icon:'FolderOpened'},
      {key:'mapping',label:'映射设置', icon:'MapLocation'},
      {key:'vods',   label:'影片管理', icon:'Film'},
      {key:'updater',label:'更新设置', icon:'Refresh'},
      {key:'admin',  label:'管理员',   icon:'User'},
    ];
    const titleMap = Object.fromEntries(menus.map(m=>[m.key,m.label]));
    const currentTitle = ref('仪表盘');

    async function doLogin(){
      loginLoading.value = true;
      try {
        const res = await api.post('/admin/login', loginForm);
        if (res && res.code===1) {
          api.token = res.data.token;
          localStorage.setItem('mxgt_token', res.data.token);
          localStorage.setItem('mxgt_user', res.data.username);
          token.value = api.token; username.value = res.data.username;
          ElMessage.success('登录成功');
          loadVersion();
        } else { ElMessage.error(res.msg||'登录失败'); }
      } finally { loginLoading.value = false; }
    }
    function logout(){ api.token=''; localStorage.removeItem('mxgt_token'); token.value=''; }
    function onMenu(k){ current.value = k; currentTitle.value = titleMap[k]||''; }

    async function loadVersion(){
      try { const r = await api.get('/api/health'); version.value = r && r.version ? r.version : ''; } catch(e){}
    }
    onMounted(()=>{ if(token.value) loadVersion(); });

    return { token, username, current, version, loginForm, loginLoading, menus, currentTitle, doLogin, logout, onMenu };
  }
};

// ---------- 通用：ECharts 容器 ----------
function useChart(domId, build){
  const inst = { e:null, init(dom, data){ if(!this.e){ this.e=echarts.init(dom);} this.e.setOption(build(data)); } };
  return inst;
}

// ---------- 仪表盘 ----------
const DashView = {
  setup(){
    const stat = ref({today_calls:0, cache_hit:0, rules:0, sources:0});
    const calls = ref([]);
    const trendEl = ref(null); const trendChart = useChart();
    const load = async ()=>{
      const ov = okData(await api.get('/admin/stats/overview'));
      if (ov) stat.value = {today_calls:ov.today_calls||0, cache_hit:ov.cache_hit||0, rules:ov.rules||0, sources:ov.sources||0};
      const cl = okData(await api.get('/admin/call-logs?page=1&size=15'));
      if (cl) calls.value = Array.isArray(cl)?cl:(cl.list||[]);
      const tr = okData(await api.get('/admin/stats/trends?range=7'));
      if (tr) drawTrend(tr);
    };
    function drawTrend(tr){
      nextTick(()=>{
        const dom = trendEl.value; if(!dom) return;
        if(!trendChart.e) trendChart.e = echarts.init(dom);
        const xs=[]; const ys=[];
        (Array.isArray(tr)?tr:(tr.points||tr.trend||[])).forEach(p=>{ xs.push(p.time||p.hour||''); ys.push(p.count||p.calls||0); });
        trendChart.e.setOption({
          tooltip:{trigger:'axis'}, grid:{left:40,right:20,top:30,bottom:30},
          xAxis:{type:'category', data:xs}, yAxis:{type:'value'},
          series:[{type:'line', smooth:true, areaStyle:{opacity:.15}, data:ys, itemStyle:{color:'#409eff'}}]
        });
      });
    }
    onMounted(load);
    return { stat, calls, trendEl, load };
  },
  template:`
  <div>
    <div class="stat-cards">
      <div class="stat-card"><span class="lbl">今日调用</span><span class="num">{{stat.today_calls}}</span></div>
      <div class="stat-card"><span class="lbl">缓存命中率</span><span class="num" style="color:#f59e0b">{{stat.cache_hit}}</span></div>
      <div class="stat-card"><span class="lbl">解析规则</span><span class="num" style="color:#67c23a">{{stat.rules}}</span></div>
      <div class="stat-card"><span class="lbl">采集源</span><span class="num" style="color:#f87171">{{stat.sources}}</span></div>
    </div>
    <div class="charts">
      <div class="chart"><h4>调用量趋势（近7日）</h4><div ref="trendEl" style="width:100%;height:250px"></div></div>
      <div class="chart"><h4>最近调用记录</h4>
        <el-table :data="calls" size="small" max-height="250">
          <el-table-column prop="api" label="接口" width="110"></el-table-column>
          <el-table-column prop="target_url" label="目标" show-overflow-tooltip></el-table-column>
          <el-table-column prop="duration_ms" label="耗时" width="80"></el-table-column>
          <el-table-column prop="created_at" label="时间" width="150"></el-table-column>
        </el-table>
      </div>
    </div>
  </div>`
};

// ---------- 播放测试（核心功能）----------
const PlayView = {
  setup(){
    const form = reactive({ url:'', title:'', ep:1 });
    const res = ref(null);
    const loading = ref(false);
    const test = async ()=>{
      if(!form.url){ ElMessage.warning('请输入链接'); return; }
      loading.value=true;
      try{
        const r = await api.get('/api/play?url='+encodeURIComponent(form.url)+'&title='+encodeURIComponent(form.title)+'&ep='+form.ep);
        if (r && r.code===1){ res.value=r.data; ElMessage.success('处理成功'); }
        else ElMessage.error(r.msg||'处理失败');
      } finally { loading.value=false; }
    };
    return { form, res, loading, test };
  },
  template:`
  <div>
    <div class="panel">
      <h3 style="margin:0 0 12px;color:#303133">🎬 播放测试（核心功能链路）</h3>
      <el-form label-width="70px">
        <el-form-item label="链接">
          <el-input v-model="form.url" placeholder="https://v.qq.com/... 或 https://xxx/index.m3u8 / a.mp4" clearable/>
        </el-form-item>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="剧名"><el-input v-model="form.title" placeholder="官方链接生效"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="集数"><el-input-number v-model="form.ep" :min="1"/></el-form-item></el-col>
        </el-row>
        <el-button type="primary" :loading="loading" @click="test">识别 + 匹配 + 去广告 处理</el-button>
      </el-form>
    </div>
    <div class="panel" v-if="res">
      <h3 style="margin:0 0 12px;color:#303133">处理结果</h3>
      <el-descriptions :column="1" border size="small">
        <el-descriptions-item label="模式"><el-tag size="small" type="info">{{res.mode}}</el-tag></el-descriptions-item>
        <el-descriptions-item label="类型">{{res.type}}</el-descriptions-item>
        <el-descriptions-item v-if="res.source" label="来源">{{res.source}}</el-descriptions-item>
        <el-descriptions-item label="最终链接">
          <el-link class="mono" type="primary" :href="res.url" target="_blank" style="word-break:break-all">{{res.url}}</el-link>
        </el-descriptions-item>
        <el-descriptions-item v-if="res.cleaned" label="AI 去广告"><el-tag type="success" size="small">已剔除广告分片</el-tag></el-descriptions-item>
      </el-descriptions>
      <div class="panel" style="margin-top:12px" v-if="res.clean_m3u8">
        <div style="font-weight:600;color:#303133;margin-bottom:8px">去广告后的干净 m3u8</div>
        <pre class="mono" style="background:#f6f8fa;padding:10px;border-radius:6px;max-height:220px;overflow:auto;font-size:12px">{{res.clean_m3u8}}</pre>
      </div>
      <div class="panel" style="margin-top:12px">
        <div style="font-weight:600;color:#303133;margin-bottom:8px">处理链路</div>
        <el-steps direction="vertical" v-if="res.steps && res.steps.length">
          <el-step v-for="(s,i) in res.steps" :key="i" :title="s"></el-step>
        </el-steps>
        <div v-else class="vl">无额外处理步骤</div>
      </div>
    </div>
  </div>`
};

// ---------- 前端设置 ----------
const FrontView = {
  setup(){
    const form = reactive({});
    const load = async ()=>{ const d=okData(await api.get('/admin/settings')); if(d) Object.assign(form,d); };
    const save = async ()=>{ const r=await api.put('/admin/settings',form); (r&&r.code===1)?ElMessage.success('已保存'):ElMessage.error(r.msg); };
    onMounted(load);
    return { form, save };
  },
  template:`
  <div class="panel">
    <h3 style="margin:0 0 12px;color:#303133">🎨 前端设置</h3>
    <el-form :model="form" label-width="130px" style="max-width:700px">
      <el-form-item label="播放页路径"><el-input v-model="form.play_path" placeholder="/"/></el-form-item>
      <el-form-item label="URL 参数名"><el-input v-model="form.url_param" placeholder="url"/></el-form-item>
      <el-form-item label="别名参数"><el-input v-model="form.alias_params" placeholder="video,src,link"/></el-form-item>
      <el-form-item label="播放器类型">
        <el-select v-model="form.player_type"><el-option label="dplayer" value="dplayer"/><el-option label="hls.js" value="hls.js"/></el-select>
      </el-form-item>
      <el-form-item label="LOGO"><el-input v-model="form.logo_url"/></el-form-item>
      <el-form-item label="页脚"><el-input v-model="form.footer_text"/></el-form-item>
      <el-form-item label="备案号"><el-input v-model="form.beian"/></el-form-item>
      <el-form-item label="缓存 TTL(秒)"><el-input-number v-model="form.cache_ttl" :min="0"/></el-form-item>
      <el-button type="primary" @click="save">保存设置</el-button>
    </el-form>
  </div>`
};

// ---------- 分析设置 ----------
const AnalysisView = {
  setup(){
    const form = reactive({});
    const testUrl = ref(''); const testRes = ref(null);
    const load = async ()=>{ const d=okData(await api.get('/admin/analysis/settings')); if(d) Object.assign(form,d); };
    const save = async ()=>{ const r=await api.put('/admin/analysis/settings',form); (r&&r.code===1)?ElMessage.success('已保存'):ElMessage.error(r.msg); };
    const test = async ()=>{ if(!testUrl.value){ElMessage.warning('请输入URL');return;} const r=await api.post('/admin/analysis/test',{url:testUrl.value}); testRes.value=r.data||r; };
    onMounted(load);
    return { form, testUrl, testRes, load, save, test };
  },
  template:`
  <div class="panel">
    <h3 style="margin:0 0 12px;color:#303133">🧠 分析设置（自动识别官方 / 直链 / 未知）</h3>
    <el-form :model="form" label-width="120px" style="max-width:600px">
      <el-form-item label="启用"><el-switch v-model="form.enabled" :active-value="1" :inactive-value="0"/></el-form-item>
      <el-form-item label="优先级">
        <el-select v-model="form.priority"><el-option label="官方优先" value="official_first"/><el-option label="直链优先" value="direct_first"/><el-option label="AI优先" value="ai_first"/></el-select>
      </el-form-item>
      <el-form-item label="未知类型"><el-select v-model="form.unknown_mode"><el-option label="拒绝" value="reject"/><el-option label="当直链" value="direct"/><el-option label="走规则" value="rule"/></el-select></el-form-item>
      <el-button type="primary" @click="save">保存</el-button>
    </el-form>
    <el-divider/>
    <h4 style="color:#303133">一键测试</h4>
    <div class="toolbar">
      <el-input v-model="testUrl" placeholder="粘贴 URL 测试类型" style="width:420px"/>
      <el-button type="primary" @click="test">识别</el-button>
    </div>
    <el-descriptions v-if="testRes" :column="2" border size="small">
      <el-descriptions-item label="类型"><el-tag type="info">{{testRes.type}}</el-tag></el-descriptions-item>
      <el-descriptions-item label="站点">{{testRes.site_name||'-'}}</el-descriptions-item>
      <el-descriptions-item label="site_code">{{testRes.site_code||'-'}}</el-descriptions-item>
      <el-descriptions-item label="直链类型">{{testRes.directive||'-'}}</el-descriptions-item>
    </el-descriptions>
  </div>`
};

// ---------- AI 设置 ----------
const AiView = {
  setup(){
    const form = reactive({});
    const m3u8 = ref(''); const analyzeLog = ref(null); const logs = ref([]); const fps = ref([]);
    const load = async ()=>{ const d=okData(await api.get('/admin/ai/settings')); if(d) Object.assign(form,d); loadLogs(); loadFps(); };
    const save = async ()=>{ const r=await api.put('/admin/ai/settings',form); (r&&r.code===1)?ElMessage.success('已保存'):ElMessage.error(r.msg); };
    const analyze = async ()=>{ if(!m3u8.value){ElMessage.warning('请输入 m3u8');return;} const r=await api.post('/admin/ai/analyze',{m3u8:m3u8.value}); if(r&&r.code===1){analyzeLog.value=r.data;ElMessage.success('分析完成，剔除 '+r.data.bad+' 个广告分片');} };
    const cleanM3U8 = async ()=>{ if(!m3u8.value){ElMessage.warning('请输入 m3u8');return;} const r=await api.post('/admin/ai/result/m3u8',{m3u8:m3u8.value}); if(r&&r.code===1){navigator.clipboard.writeText(r.data);ElMessage.success('已复制干净 m3u8');} };
    const loadLogs = async ()=>{ const d=okData(await api.get('/admin/ai/logs')); logs.value=d||[]; };
    const loadFps = async ()=>{ const d=okData(await api.get('/admin/ai/fingerprints')); fps.value=d||[]; };
    onMounted(load);
    return { form, m3u8, analyzeLog, logs, fps, save, analyze, cleanM3U8 };
  },
  template:`
  <div>
    <div class="panel">
      <h3 style="margin:0 0 12px;color:#303133">🤖 AI 设置（m3u8 广告识别 / 去广告）</h3>
      <el-form :model="form" label-width="120px" style="max-width:620px">
        <el-form-item label="启用"><el-switch v-model="form.enabled" :active-value="1" :inactive-value="0"/></el-form-item>
        <el-form-item label="自动去广告"><el-switch v-model="form.auto_skip_ad" :active-value="1" :inactive-value="0"/></el-form-item>
        <el-form-item label="算法"><el-select v-model="form.provider"><el-option label="openaicompat" value="openaicompat"/><el-option label="doubao" value="doubao"/><el-option label="qwen" value="qwen"/></el-select></el-form-item>
        <el-form-item label="API Key"><el-input v-model="form.api_key" show-password/></el-form-item>

    <div class="toolbar"><h3 style="margin:0;color:#303133">📼 影片管理</h3><el-input v-model="kw" placeholder="搜索剧名" style="width:220px" @keyup.enter="search"/><el-button type="primary" size="small" @click="search">搜索</el-button></div>
    <el-table :data="vods" size="small">
      <el-table-column prop="name" label="剧名" min-width="160"></el-table-column>
      <el-table-column prop="category" label="分类" width="120"></el-table-column>
      <el-table-column prop="year" label="年份" width="70"></el-table-column>
      <el-table-column prop="region" label="地区" width="90"></el-table-column>
      <el-table-column prop="vod_id" label="来源ID" show-overflow-tooltip></el-table-column>
      <el-table-column label="集数" width="80"><template #default="s">{{s.row.episodes? s.row.episodes.length : 0}}</template></el-table-column>
    </el-table>
    <el-pagination style="margin-top:12px" layout="prev, pager, next, total" :total="total" :page-size="20" v-model:current-page="page" @current-change="load"/>
  </div>`
};

// ---------- 更新设置 ----------
const UpdaterView = {
  setup(){
    const form = reactive({});
    const logs = ref([]);
    const load = async ()=>{ const d=okData(await api.get('/admin/update/config')); if(d) Object.assign(form,d); const lg=okData(await api.get('/admin/update/logs')); logs.value=lg||[]; };
    const save = async ()=>{ const r=await api.put('/admin/update/config',form); (r&&r.code===1)?ElMessage.success('已保存'):ElMessage.error(r.msg); };
    const check = async ()=>{ const r=await api.post('/admin/update/check',{}); if(r&&r.code===1){ ElMessage.success(r.data.has_update?'发现新版本 '+r.data.remote:'已是最新 '+r.data.current);} };
    const speed = async ()=>{ const r=await api.post('/admin/update/mirror-speed',{}); (r&&r.code===1)?ElMessage.success('测速完成'):ElMessage.error(r.msg); };
    const dl = async ()=>{ const r=await api.post('/admin/update/download',{}); (r&&r.code===1)?ElMessage.success('已下载，请重启服务'):ElMessage.error(r.msg); };
    onMounted(load);
    return { form, logs, save, check, speed, dl };
  },
  template:`
  <div>
    <div class="panel">
      <h3 style="margin:0 0 12px;color:#303133">🔄 更新设置</h3>
      <el-form :model="form" label-width="120px" style="max-width:620px">
        <el-form-item label="仓库地址"><el-input v-model="form.repo"/></el-form-item>
        <el-form-item label="启动检查"><el-switch v-model="form.auto_check" :active-value="1" :inactive-value="0"/></el-form-item>
        <div class="toolbar"><el-button type="primary" @click="save">保存</el-button><el-button @click="speed">测速镜像</el-button><el-button type="warning" @click="check">检查更新</el-button><el-button type="danger" @click="dl">一键下载更新</el-button></div>
      </el-form>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 12px;color:#303133">更新日志</h3>
      <el-table :data="logs" size="small">
        <el-table-column prop="version" label="版本" width="100"><template #default="s"><el-tag size="small">{{s.row.version}}</el-tag></template></el-table-column>
        <el-table-column prop="status" label="状态" width="90"></el-table-column>
        <el-table-column prop="message" label="信息"></el-table-column>
        <el-table-column prop="created_at" label="时间" width="160"></el-table-column>
      </el-table>
    </div>
  </div>`
};

// ---------- 管理员 ----------
const AdminView = {
  setup(){
    const health = ref(null);
    const info = [
      {label:'服务地址', val: location.protocol+'//'+location.host},
      {label:'管理页面', val: location.protocol+'//'+location.host+'/admin-ui'},
      {label:'统一播放入口', val: '/api/play?url=&title=&ep='},
      {label:'苹果CMS', val: '/api.php/provide/vod/?ac=list'},
      {label:'解析接口', val: '/api/resolve?url='},
    ];
    const load = async ()=>{ const r=await api.get('/api/health'); if(r&&r.code===1) health.value=r; };
    onMounted(load);
    return { info, health };
  },
  template:`
  <div class="panel">
    <h3 style="margin:0 0 12px;color:#303133">🔑 系统信息</h3>
    <el-descriptions :column="1" border size="small" style="max-width:640px">
      <el-descriptions-item v-for="it in info" :key="it.label" :label="it.label"><span class="mono">{{it.val}}</span></el-descriptions-item>
      <el-descriptions-item label="版本"><el-tag type="success">{{health && health.version}}</el-tag></el-descriptions-item>
      <el-descriptions-item label="Go 运行时">{{health && health.runtime}}</el-descriptions-item>
      <el-descriptions-item label="数据库">{{health && health.db}}</el-descriptions-item>
      <el-descriptions-item label="缓存">{{health && health.cache}}</el-descriptions-item>
    </el-descriptions>
    <div class="vl" style="margin-top:12px;font-size:12px">默认账号 admin / admin123（可用环境变量 MXGT_ADMIN_USER / MXGT_ADMIN_PASSWORD 覆盖）</div>
  </div>`
};

// ---------- 注册组件 ----------
App.components = {
  DashView, PlayView, FrontView, AnalysisView, AiView, MatchingView, ChainView,
  RulesView, SourcesView, MappingView, VodsView, UpdaterView, AdminView
};
createApp(App).use(ElementPlus).mount('#app');
</script>
</body>
