name: build-go

on:
  push:
    branches: [ go ]
    paths-ignore:
      - 'latest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 git（供提交最新版本清单）
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 编译单文件二进制 + 打包（命名规则：文件名+版本号+时间）
        run: |
          VER=$(grep -oP 'AppVersion\s*=\s*"\K[^"]+' main.go)
          # CGO_ENABLED=0 静态编译：不依赖宿主 glibc，旧系统（CentOS 7 等）也能直接运行
          # 构建整个包（.）：包含内置资源站配置 sites_static.go
          CGO_ENABLED=0 go build -ldflags "-s -w" -o mxgt-go .
          # 单文件静态可执行（零依赖），并复制 README 说明
          TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          mkdir -p release
          cp README.md README-go.md
          zip -j "release/MXGT_go_${VER}_${TS}.zip" mxgt-go README-go.md
          echo "VER=${VER}" >> "$GITHUB_ENV"
          echo "ZIP=MXGT_go_${VER}_${TS}.zip" >> "$GITHUB_ENV"
          ls -la mxgt-go release/

      - name: 创建/更新 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: go-v${{ env.VER }}
          name: MXGT-Go ${{ env.VER }}
          body: |
            MXGT-Go ${{ env.VER }} — 单文件 M3U8 广告分析与去广告服务（Go 分支）

            - 单一静态可执行文件，标准库零依赖，下载即用（无需 PHP/nginx）
            - 接口：
              - GET /api/clean?url=<m3u8>  → 过滤后无广告 M3U8（绝对地址）
              - GET /api/clean/json?url=   → JSON 统计 + 过滤后文本
              - GET /api/replace?url=<官方视频页> → 官替链路：资源站匹配后返回无广告直链
              - GET /api/sites & /toggle & /test → 资源站列表/启停/搜索测试（默认全部禁用）
              - GET /healthz               → 健康检查
            - 官替链路：复用 PHP 版资源站列表（resource_sites.json），后台按需启用采集站后即可解析官方视频页
            - 用法：./mxgt-go -addr :8080
            - 部署：见 README-go.md
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 写入并提交最新版本清单 latest.json（供服务端远程更新检查）
        run: |
          printf '{"version":"%s","zip":"%s"}\n' "$VER" "$ZIP" > latest.json
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json 无变化，跳过提交"
          else
            git commit -m "自动更新版本清单 latest.json → ${VER}"
            git push origin go
          fi
