name: Build Release

# 云端编译：推送版本 tag（v*）时，在 GitHub Actions 云端编译多平台 Go 可执行文件并发布 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.armv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux（服务器主流）
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: linux
            arch: "386"
            ext: ""
          - os: linux
            arch: arm
            armv: "7"
            ext: ""
          # Windows
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
          - os: windows
            arch: "386"
            ext: ".exe"
          # macOS
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          # FreeBSD
          - os: freebsd
            arch: amd64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (CGO_ENABLED=0 静态编译 + go:embed 单文件)
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.armv }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/mxgt-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.armv }}${{ matrix.ext }} ./cmd/server

      - name: Generate checksum
        run: |
          cd dist && sha256sum mxgt-* > mxgt-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.armv }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mxgt-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.armv }}
          path: dist/

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Zip per platform
        run: |
          cd dist
          for f in mxgt-*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256) continue ;;
              *.exe) zip -j "$(basename "$f" .exe).zip" "$f" ;;
              *) zip -j "$f.zip" "$f" ;;
            esac
          done
          rm -f *.sha256
          sha256sum *.zip > SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
